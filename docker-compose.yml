services:
  stockscan-tw:
    build: .
    image: stockscan-tw
    container_name: stockscan-tw
    restart: unless-stopped
    ports:
      # host:container - the server inside listens on PORT too (see environment)
      - "${PORT:-3388}:${PORT:-3388}"
    environment:
      PORT: ${PORT:-3388}
      # serve under a path prefix, e.g. /stockscan-tw (empty = the root)
      BASE_URL: ${BASE_URL:-}
      # background crawl of every listed company's recent reports from MOPS (0 = off)
      STOCKSCAN_CRAWL: ${STOCKSCAN_CRAWL:-1}
      # quarters per company the crawler keeps
      STOCKSCAN_DEPTH: ${STOCKSCAN_DEPTH:-12}
      # custom-ETF daily bars: TradingView websocket (0 = off) -> IBKR TWS -> Yahoo
      TV_ENABLED: ${TV_ENABLED:-1}
      # IBKR TWS / IB Gateway on the Docker host (enable "Allow connections from
      # localhost only" = off in TWS, and trust the Docker network's IP)
      IB_ENABLED: ${IB_ENABLED:-1}
      IB_HOST: ${IB_HOST:-host.docker.internal}
      IB_PORT: ${IB_PORT:-7496}
    volumes:
      # the store (reports, scores, listed table) and the caches survive rebuilds
      - ./data:/app/data
    extra_hosts:
      # host.docker.internal on Linux (Docker Desktop provides it already)
      - "host.docker.internal:host-gateway"
