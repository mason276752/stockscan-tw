# Publish the pure-frontend build (web/dist-static) to GitHub Pages:
#   - on every push to main (code only: the data comes from the data ref)
#   - every three hours: first the TWSE listed-company table is refreshed - a
#     new listing joins, a delisted company's reports are dropped - then the
#     reports MOPS has and the store lacks are fetched in a batch of
#     STOCKSCAN_FETCH_BUDGET minutes, parsed, scored and pushed to the data
#     ref, then the site is rebuilt and published. Each batch takes the
#     newest quarter of every company first, then the quarter before for
#     every company, and so on (biggest companies first within a quarter):
#     a new repository shows every company's latest report after the first
#     couple of runs and fills in the older quarters over the next days;
#     after that a run finds only the new reports and is short
#   - by hand (Actions → Run workflow), optionally with another budget
# Data lives on the ref refs/data/main, never on main: data/store (reports,
# scores, the listed table) and data/bars (the finished years of daily
# bars). Outside refs/heads/ so that a plain `git clone` does not download
# it - only `git fetch origin refs/data/main` does (scripts/pull-data.sh).
# Here it is fetched into data-repo/ (or started empty the first time) and
# the tools are pointed at it with STOCKSCAN_STORE / STOCKSCAN_BARS. After a
# scheduled fetch the new files go up as one more commit on that ref. (A
# commit's parent is what makes the push small: git only sends what the
# parent lacks. An orphan commit, or a rewritten ref, would resend it all.)
# This year's bars (head.zst, not in git) are fetched from TradingView here
# before the build and kept between runs in the Actions cache.
# Needs: Settings → Pages → Source = "GitHub Actions".
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # cron is UTC; Taipei is UTC+8 all year: 08:00, 11:00, 14:00, 17:00,
    # 20:00, 23:00, 02:00, 05:00 Taipei. Reports reach MOPS through the day and
    # into the evening after board meetings (most in the last days before the
    # deadlines: Q1 May 15, Q2 Aug 14, Q3 Nov 14, annual Mar 31); the 17:00
    # run has the day's bars (final after 14:30).
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      fetch_budget:
        description: 'Minutes to spend fetching reports from MOPS in this run (~15 reports a minute; all ~1,000 companies × 12 quarters take about 15 hours in total)'
        required: false
        default: '60'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      STOCKSCAN_STORE: ${{ github.workspace }}/data-repo/data/store
      STOCKSCAN_BARS: ${{ github.workspace }}/data-repo/data/bars
      STOCKSCAN_CRAWL: '0'
      STOCKSCAN_FETCH_BUDGET: ${{ inputs.fetch_budget || '60' }}
      STOCKSCAN_MOPS_PARALLEL: '8'
      IB_ENABLED: '0'
      TV_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      # the data ref, beside the code (tip only; the token lets the step
      # further down push a new commit to it). A repository without one yet
      # starts an empty history that the first push creates.
      - name: Fetch the data ref
        run: |
          git init -q data-repo
          cd data-repo
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code origin refs/data/main > /dev/null; then
            git fetch -q --depth=1 --no-tags origin refs/data/main
            git checkout -q FETCH_HEAD
            echo "data ref $(git rev-parse --short HEAD): $(git log -1 --format=%s)"
          else
            echo "no refs/data/main yet: starting an empty data history"
            git checkout -q --orphan data
            mkdir -p data/store data/bars
            printf 'data/bars/**/head.zst\n*.tmp\n' > .gitignore
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix web ci

      # the small SQLite cache (market snapshot, TWSE's latest quarters, crawl
      # bookkeeping …) survives between runs so only what its TTLs say is
      # stale gets fetched again. What the next run must know (the listed
      # table, the reports MOPS does not have) lives in the store itself.
      - name: Restore the cache database
        uses: actions/cache@v4
        with:
          path: data/cache.sqlite*
          key: cache-sqlite-${{ github.run_id }}
          restore-keys: cache-sqlite-

      # scheduled / manual runs: the listed table, then the reports
      - name: Fetch new reports from MOPS
        if: github.event_name != 'push'
        run: npm run fetch:new

      # this year's bars (head.zst of every symbol): restored from the last
      # run's cache, topped up from TradingView on scheduled / manual runs
      # (one request per symbol, a few minutes the first time after a close,
      # a minute when they are already fresh), saved for the next run. A push
      # only rebuilds with the bars the last such run left in the cache -
      # unless there is no such cache (evicted, or the earlier runs failed
      # before saving one): then it fetches too, or the site would go out
      # with last year's prices. A cache key is immutable, so it carries the
      # run id; restore-keys picks the newest previous one.
      - name: Restore this year's bars
        id: bars
        uses: actions/cache@v4
        with:
          path: data-repo/data/bars/**/head.zst
          key: bars-head-${{ github.run_id }}
          restore-keys: bars-head-
      # (the job turns TradingView off for the server-side tools - this is
      # the one step that needs it on)
      - name: Fetch this year's bars from TradingView
        if: github.event_name != 'push' || steps.bars.outputs.cache-matched-key == ''
        run: npm run fetch:bars
        continue-on-error: true
        env:
          TV_ENABLED: '1'
          STOCKSCAN_BARS_CRAWL_PARALLEL: '8'

      # the store as it is now, as one more commit on the data ref
      # (head.zst and .tmp files are ignored by the ref's .gitignore).
      # Nothing changed: nothing pushed. A crossing of a year boundary (a
      # new <year>.zst) lands here the same way.
      - name: Push the data ref
        if: github.event_name != 'push'
        working-directory: data-repo
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -q -m "data: $(date -u +%Y-%m-%d) [ci]"
            git push -q origin HEAD:refs/data/main
            echo "pushed $(git rev-parse --short HEAD)"
          fi

      # scores the store lacks for the current SCORE_VERSION (a bump in the
      # commit being built): every build, so the site never goes out without
      # scores; a scheduled run has already pushed them with the data ref
      - name: Score reports the store has not scored yet
        run: npm run rescore

      # the heavy parts run in the committed Linux binary of tools/stockscan-static
      # (bin/stockscan-static-x86_64-linux, rebuilt with build-linux.sh - nothing
      # is compiled here); --link: the store goes into the site as hard links.
      # The listed table and the market snapshot are refreshed here as well.
      - name: Build the static site
        run: |
          chmod +x tools/stockscan-static/bin/stockscan-static-x86_64-linux
          node server/tools/build-static.mjs --link
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
